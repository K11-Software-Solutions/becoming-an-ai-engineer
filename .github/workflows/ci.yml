name: CI quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8
  AIENG_PROVIDER: fake

jobs:
  tests:
    name: Unit tests and negative controls
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  evals:
    name: Eval gate (fake provider)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python evals/run_evals.py --json eval-results.json
      - name: CLI smoke test
        run: |
          python -m aieng refine "As a designer, I want to comment on mockups so feedback stays in one place."
          python -m aieng triage "Export the sprint report as a PDF file"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results.json
